{% set name = "soxspipe" %}
{% set version = "0.19.0" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/soxspipe-{{ version }}.tar.gz
  sha256: 5ad7c6a251935dd42f666b1ece8a23bdaebea13b137fb076e6df4e35357725b4

build:
  entry_points:
    - soxspipe=soxspipe.cl_utils:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=70
    - setuptools-scm
    - wheel
  run:
    - python >={{ python_min }}
    - pyyaml ==6.0.2
    - fundamentals ==2.7.6
    - astropy-base ==7.2.0
    - uncompresspy ==0.4.1
    - ccdproc ==2.4.2
    - docopt ==0.6.2
    - photutils ==1.13.0
    - matplotlib-base
    - numpy ==2.1.0
    - unicodecsv ==0.14.1
    - pandas >=2.2.3,<3
    - tabulate ==0.9.0
    - bottleneck ==1.4.0
    - multiprocess ==0.70.16
    - specutils ==1.16.0
    - humanize ==4.11.0
    - line_profiler
    - memory_profiler
    - scikit-learn
    - jinja2
    - numba >=0.61

test:
  imports:
    - soxspipe
    - soxspipe.commonutils
    - soxspipe.recipes
  commands:
    - soxspipe --help
    # FAIL IF THE INSTALLED METADATA VERSION IS NOT THE RECIPE VERSION (E.G. 0.0.0 WITHOUT SETUPTOOLS-SCM)
    - python -c "import importlib.metadata as m, sys; v = m.version('soxspipe'); sys.exit(0 if v == '{{ version }}' else 'metadata version ' + v + ' != {{ version }}')"
    - test "$(soxspipe -v)" = "v{{ version }}"
  requires:
    - python {{ python_min }}

about:
  home: https://github.com/thespacedoctor/soxspipe
  license: GPL-3.0-only
  license_family: GPL3
  license_file: LICENSE
  summary: A python package and command-line tools to The data-reduction pipeline for the SOXS instrument
  doc_url: https://soxspipe.readthedocs.io
  dev_url: https://github.com/thespacedoctor/soxspipe

extra:
  recipe-maintainers:
    - thespacedoctor
